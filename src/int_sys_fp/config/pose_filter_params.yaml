pose_filter:
  # Process noise Q for the pose state [x,y,theta]. Chosen "a tavolino": the Gazebo
  # simulator has near-perfect dynamics, so this expresses how much model mismatch
  # (wheel slip, discretization, unmodeled disturbance) we choose to assume.
  shared_process_noise: true   # if false, use per_robot blocks below instead
  Q:
    x_var: 0.001       # m^2
    y_var: 0.001       # m^2
    theta_var: 0.001   # rad^2

  initial_covariance:
    p0_scale: 10.0      # P0 = p0_scale * I(3); x0 = [0,0,0] (zero-mean, inflated covariance)

  # Scaled unscented transform parameters. With L=3 (state [x,y,theta]):
  #   lambda = alpha^2 * (L + kappa) - L,  sigma-point spread = sqrt(L + lambda)
  # Heuristics: kappa = 3 - L (Julier) -> 0 here; beta = 2 is optimal for Gaussians;
  # alpha in [1e-3, 1].
  #
  # IMPORTANT: alpha -> 0 makes the scaled UT converge EXACTLY to the EKF's
  # linearisation - a known mathematical property, not a bug. The previous default of
  # 1e-3 gave lambda = -2.999997, a sigma spread of 1.7e-3*chol(P) and weights of order
  # 1e6, i.e. an EKF in disguise: an EKF-vs-UKF comparison could not show any
  # difference. alpha = 1.0 gives lambda = 0, spread sqrt(3) ~ 1.73 sigma, and weights
  # Wm0 = 0, Wmi = Wci = 1/6, Wc0 = 2 - all well conditioned, none negative.
  # (alpha ~ 0.5 gives a NEGATIVE Wm0, which can make P indefinite.)
  # Keep alpha = 1e-3 available as the deliberate "degenerate to EKF" control case.
  ukf:
    alpha: 1.0
    beta: 2.0
    kappa: 0.0

  # theta_imu is near ground-truth in this simulator (Gazebo's gazebo_ros_imu_sensor
  # plugin never populates orientation_covariance - verified from source, TODO in
  # plugin code). Synthetic noise is added in software before using it as a
  # correction, so the theta estimation problem stays non-trivial.
  imu_orientation_noise_std: 0.02   # rad (~1.1 deg)

  # one_step_riccati: standard EKF/UKF per-step gain recompute (F_k,H_k time-varying).
  # sdre_ci_experimental: optional stretch module (SDRE-style gain + Covariance
  # Intersection fusion with the classic estimate) - off by default, not on the
  # critical path.
  gain_mode: "one_step_riccati"

  per_robot:   # only used if shared_process_noise is false
    robot_0: {x_var: 0.001, y_var: 0.001, theta_var: 0.001}
    robot_1: {x_var: 0.001, y_var: 0.001, theta_var: 0.001}
    robot_2: {x_var: 0.001, y_var: 0.001, theta_var: 0.001}
