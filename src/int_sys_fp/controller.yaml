controller_params:
    control_frequency: 50.0  # Controller loop frequency [Hz]
    
    position_gains:
      Kp_r1 : [10.0, 10.0, 0.0]   # Proportional gains for robot 1 [Kp_x, Kp_y, Kp_z]
      Kp_r2 : [10.0, 10.0, 0.0]   # Proportional gains for robot 2 [Kp_x, Kp_y, Kp_z]
      Kp_r3 : [10.0, 10.0, 0.0]   # Proportional gains for robot 3 [Kp_x, Kp_y, Kp_z]
    velocity_gains:
      Kv_r1 : [6.198, 6.198, 0.0]   # Velocity gains for robot 1 [Kv_x, Kv_y, Kv_z]
      Kv_r2 : [6.198, 6.198, 0.0]   # Velocity gains for robot 2 [Kv_x, Kv_y, Kv_z]
      Kv_r3 : [6.198, 6.198, 0.0]   # Velocity gains for robot 3 [Kv_x, Kv_y, Kv_z]
    integral_gains:
      Ki_r1 : [0.01, 0.01, 0.0]    # Integral gains for robot 1 [Ki_x, Ki_y, Ki_z]
      Ki_r2 : [0.01, 0.01, 0.0]    # Integral gains for robot 2 [Ki_x, Ki_y, Ki_z]
      Ki_r3 : [0.01, 0.01, 0.0]    # Integral gains for robot 3 [Ki_x, Ki_y, Ki_z]
    max_velocities:
      max_vel_r : [0.22, 0.22, 0.0]   # maximum velocity for a turtlebot3 [m/s]
      max_omega_r : [2.84, 2.84, 0.0] # maximum angular velocity for a turtlebot3 [rad/s]
    integral_limits:
      max_integral : [2.0, 2.0, 0.0]  # maximum integral accumulation [m*s]